name: Catalogue freshness

# Daily research pass: asks Claude (with web search) for current prices/policies
# and opens a PR proposing edits to catalogue_review.csv. It never touches the
# live seed catalogue — a human reviews and merges the PR.
#
# Requires repo secret ANTHROPIC_API_KEY (Settings → Secrets → Actions), on an
# account with API credit. Run manually anytime from the Actions tab.

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install the Anthropic SDK
        run: gem install anthropic --no-document

      - name: Research current figures
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ruby script/freshness.rb

      - name: Open a review PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: catalogue_review.csv
          branch: catalogue/freshness
          commit-message: "Catalogue freshness: proposed figure updates"
          title: "Catalogue freshness — proposed updates for review"
          body: |
            Automated daily research pass (Claude + web search).

            This updates **catalogue_review.csv** with proposed pricing/policy
            figures and per-tool notes (source + confidence). **Review before
            merging** — these are machine-drafted, not verified facts.

            To apply approved changes to the live catalogue, copy the verified
            rows/fields into `db/seeds/ai_tool_catalogue_text_models.csv` and
            re-run `bin/rails db:seed`.
          labels: catalogue, automated
